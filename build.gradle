plugins {
	id 'java-library'
	id 'maven-publish'
	id 'jacoco'
	id 'signing'
	id 'biz.aQute.bnd.builder' version '7.4.0'
}

repositories {
	mavenCentral()
//	mavenLocal()
}

// Gatling fork: published as io.gatling:jodd-lagarto, a drop-in replacement for org.jodd:jodd-lagarto
// the version is passed by the release workflow from the git tag
group = 'io.gatling'
version = findProperty('releaseVersion') ?: '0.0.0-SNAPSHOT'

rootProject.description = 'Java HTML parsers suite'

ext {
}

java {
	withSourcesJar()
	withJavadocJar()
}

// Gradle runs on Java 17+, but the library targets Java 8
tasks.withType(JavaCompile).configureEach {
	options.release = 8
}

configurations {
	jflex
}

dependencies {
	// the skeleton is for JFlex 1.8.2
	jflex 'de.jflex:jflex:1.8.2'
	api 'org.slf4j:slf4j-api:1.7.36'
	api 'org.jodd:jodd-util:6.3.0'
	testImplementation 'org.junit.jupiter:junit-jupiter-api:5.8.+'
	testRuntimeOnly 'org.junit.jupiter:junit-jupiter-engine:5.8.+'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher:1.8.+'
	testRuntimeOnly 'ch.qos.logback:logback-classic:1.2.11'
}

// the generated lexer is committed, it's regenerated when the grammar changes
def generateLexer = tasks.register('generateLexer', JavaExec) {
	group = 'Build'
	description = 'Generates the CSSelly lexer with JFlex'
	def grammar = 'src/main/jflex/jodd/csselly/csselly.jflex'
	def skeleton = 'src/main/jflex/jodd/csselly/skeleton-1.8.2.jodd'
	def outputDir = 'src/main/java/jodd/csselly'
	inputs.files(grammar, skeleton)
	outputs.file("${outputDir}/CSSellyLexer.java")
	classpath = configurations.jflex
	mainClass = 'jflex.Main'
	workingDir = projectDir
	// relative paths, so the generated lexer doesn't depend on where the project is
	args '-q', '--nobak', '--skel', skeleton, '-d', outputDir, grammar
}

tasks.named('compileJava') {
	dependsOn generateLexer
}

tasks.named('sourcesJar') {
	dependsOn generateLexer
}

jar {
	bundle {
		bnd('-exportcontents': 'jodd.*')
	}
	manifest {
		attributes(
				'Implementation-Title': project.name,
				'Implementation-Version': project.version,
				'Debug-Info': 'on',
				'Built-By': 'jodd.org'
		)
	}
}

javadoc {
	options.addStringOption('Xdoclint:none', '-quiet')
	if (JavaVersion.current().isJava9Compatible()) {
		options.addBooleanOption('html5', true)
	}
}

test {
	useJUnitPlatform()
	// tests can run on another JVM than Gradle's, eg: -PtestJavaVersion=8
	def testJavaVersion = findProperty('testJavaVersion')
	if (testJavaVersion) {
		javaLauncher = javaToolchains.launcherFor {
			languageVersion = JavaLanguageVersion.of(testJavaVersion as int)
		}
	}
	testLogging {
		events "standardOut", "passed", "skipped", "failed"
		showExceptions = true
		exceptionFormat = "full"
		showCauses = true
		showStackTraces = true
	}

	addTestListener(new TestListener() {
		@Override
		void beforeSuite(TestDescriptor suite) {
		}

		@Override
		void afterSuite(TestDescriptor desc, TestResult result) {
			if (!desc.parent) { // will match the outermost suite
				def output = "Results: ${result.resultType} (${result.testCount} tests, ${result.successfulTestCount} successes, ${result.failedTestCount} failures, ${result.skippedTestCount} skipped)"
				def startItem = '|  ', endItem = '  |'
				def repeatLength = startItem.length() + output.length() + endItem.length()
				println('\n' + ('-' * repeatLength) + '\n' + startItem + output + endItem + '\n' + ('-' * repeatLength))
			}
		}

		@Override
		void beforeTest(TestDescriptor testDescriptor) {
		}

		@Override
		void afterTest(TestDescriptor testDescriptor, TestResult result) {
		}
	})
}

jacocoTestReport {
	reports {
		xml.required = true
		csv.required = false
		html.required = true
	}
}

check.dependsOn jacocoTestReport

//
// PUBLISH
//

// releases are deployed to the repository given by the release workflow, eg Gatling's staging repository
ext.releaseRepository = System.getenv('RELEASE_REPOSITORY_URL')

publishing {
	publications {
		mavenJava(MavenPublication) {
			artifactId = 'jodd-lagarto'
			from components.java
			versionMapping {
				usage('java-api') {
					fromResolutionOf('runtimeClasspath')
				}
				usage('java-runtime') {
					fromResolutionResult()
				}
			}
			pom {
				name = 'Jodd Lagarto (Gatling fork)'
				description = 'Java HTML/XML parsers suite, forked by Gatling with CSSelly fixes'
				url = 'https://github.com/gatling/jodd-lagarto'
				licenses {
					license {
						name = 'BSD-2-Clause'
						url = 'https://github.com/oblac/jodd-lagarto/blob/master/LICENSE'
					}
				}
				developers {
					developer {
						id = 'igor'
						name = 'Igor Spasić'
						email = 'igor@jodd.org'
						timezone = '+1'
					}
				}
				scm {
					url = 'https://github.com/gatling/jodd-lagarto'
					connection = 'scm:git:git://github.com/gatling/jodd-lagarto.git'
					developerConnection = 'scm:git:ssh://git@github.com/gatling/jodd-lagarto.git'
				}
			}
		}
	}
	repositories {
		if (releaseRepository) {
			maven {
				name = 'release'
				url = releaseRepository
				credentials {
					username = System.getenv('RELEASE_REPOSITORY_USERNAME')
					password = System.getenv('RELEASE_REPOSITORY_PASSWORD')
				}
			}
		}
	}
}

signing {
	required = { releaseRepository != null }
	def signingKey = System.getenv('SIGNING_KEY')
	if (signingKey) {
		useInMemoryPgpKeys(signingKey, System.getenv('SIGNING_PASSWORD'))
	}
	sign publishing.publications.mavenJava
}

tasks.register('install') {
	dependsOn publishToMavenLocal
	group = 'Publishing'
	description = 'Installs artifacts to local Maven repository'
}

//
// RELEASE
//

tasks.register('release') {
	group = 'Project'
	description = 'Rebuilds everything for the release.'

	dependsOn clean
	dependsOn build
	dependsOn javadoc
	dependsOn jacocoTestReport
}


//
// UTILS
//

apply from: "${rootProject.projectDir}/gradle/license.gradle"

tasks.named('wrapper') {
    distributionType = Wrapper.DistributionType.ALL
}

static def timestamp() {
    return new Date().format('yyyyMMddHHmmss')
}
