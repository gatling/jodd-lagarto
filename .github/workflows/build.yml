name: Build

on:
  push:
    branches:
      - gatling
  pull_request:
    branches:
      - gatling

defaults:
  run:
    shell: bash

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Gradle 6.5.1 doesn't run on Java 17+
      - name: Set up JDK 11
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: 'zulu'
          java-version: '11'

      - name: Build
        run: ./gradlew --no-daemon build
